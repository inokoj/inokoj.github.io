# Google スプレッドシート → publications.html の自動反映
#   - Actions タブから手動実行（workflow_dispatch）
#   - 毎日 18:00 UTC（03:00 JST）に自動実行
# 事前準備: リポジトリの Settings > Secrets and variables > Actions に
#   SHEET_CSV_URL（シートの CSV 取得 URL）を登録しておく。
name: Build publications

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch sheet and build publications.html
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
        run: |
          if [ -z "$SHEET_CSV_URL" ]; then
            echo "SHEET_CSV_URL secret is not set"; exit 1
          fi
          python scripts/build.py --fetch

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/publications.csv publications.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update publications from spreadsheet"
            git push
          fi
